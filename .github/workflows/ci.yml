name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar (incluye SQL Server en Testcontainers)
        run: mvn -B -ntp verify
      - name: Publicar JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: scouting-backoffice
          path: target/scouting-backoffice-*.jar
          retention-days: 30
