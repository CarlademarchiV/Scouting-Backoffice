# Perfil para desarrollo en la PC: Flyway crea el esquema y la cookie de sesión funciona sin HTTPS.
# La conexión a la base y los datos de Entra van en config/scouting.yml.
spring:
  flyway:
    enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    uy.edu.ucu.scouting: DEBUG
